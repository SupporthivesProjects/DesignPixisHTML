<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice | DesignPixis</title>
<meta name="description" content="Your DesignPixis invoice.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<script>(function(){var d=document.documentElement;if(!matchMedia("(prefers-reduced-motion: reduce)").matches&&!("onpagereveal" in window))d.classList.add("fx")})()</script>
<link rel="stylesheet" href="assets/site.css">
</head>
<body class="inv-page" data-page="invoice">

<style>
html,body{background:#E9E7E1}
.inv-bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 24px;background:rgba(233,231,225,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.inv-bar .l{display:flex;align-items:center;gap:12px;font-size:15px}
.inv-bar .l svg{width:24px;height:24px}
.inv-bar .r{display:flex;gap:8px}
.inv-stage{display:flex;justify-content:center;padding:24px 24px 64px}
.inv-fit{width:794px;transform-origin:0 0}
.inv-msg{max-width:480px;margin:80px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.inv-msg h1{font-weight:600;font-size:32px;letter-spacing:-.03em}
.inv-msg p{color:rgba(18,18,20,.72);line-height:1.5}

/* the sheet: Figma invoice / template 12217:7025, A4 at 794 x 1123 */
.sheet{width:794px;height:1123px;background:#fff;display:flex;box-shadow:0 30px 60px -20px rgba(18,18,20,.25);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;color:#121214;-webkit-print-color-adjust:exact;print-color-adjust:exact;overflow:hidden}
.sheet .side{width:248px;flex:none;background:#121214;color:#fff;padding:32px;display:flex;flex-direction:column;justify-content:space-between}
.sheet .side .top{display:flex;flex-direction:column;gap:48px}
.sheet .lg{display:flex;align-items:center;gap:8px;font-family:"Geist",Arial,sans-serif;font-weight:600;font-size:20px;line-height:1.2;letter-spacing:-.02em}
.sheet .lg svg{width:24px;height:24px;flex:none}
.sheet .ttl b{display:block;font-weight:700;font-size:44px;line-height:1.1}
.sheet .ttl span{display:block;margin-top:8px;font-weight:700;font-size:14px;line-height:1.2;letter-spacing:.04em;opacity:.6}
.sheet .bot{display:flex;flex-direction:column;gap:24px}
.sheet .art{width:184px;height:276px;border-radius:12px;object-fit:cover;display:block}
.sheet .ct{font-size:12px;line-height:1.5}
.sheet .ct b{font-weight:700;display:block}
.sheet .ct span{display:block;opacity:.6}
.sheet .main{flex:1;min-width:0;padding:56px 48px 40px;display:flex;flex-direction:column;justify-content:space-between}
.sheet .content{display:flex;flex-direction:column;gap:40px}
.sheet .meta{display:flex;justify-content:space-between;align-items:flex-end}
.sheet .k{font-weight:700;font-size:10px;line-height:1.2;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.sheet .who{display:flex;flex-direction:column;gap:8px}
.sheet .who b{font-weight:700;font-size:28px;line-height:1.2}
.sheet .iss{display:flex;flex-direction:column;gap:8px;align-items:flex-end;text-align:right}
.sheet .iss span:not(.k){font-size:14px;line-height:1.5}
.sheet .dv{height:1px;background:rgba(18,18,20,.12)}
.sheet .ln{display:flex;gap:16px;align-items:flex-start;padding:20px 0;border-bottom:1px solid rgba(18,18,20,.08)}
.sheet .ln .n{font-weight:700;font-size:12px;line-height:1.6;color:#2E47E6}
.sheet .ln .i{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sheet .ln .i b{font-weight:700;font-size:16px;line-height:1.3}
.sheet .ln .i span{font-size:13px;line-height:1.5;opacity:.6}
.sheet .ln .p{font-weight:700;font-size:16px;line-height:1.3;white-space:nowrap}
.sheet .sum{display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5}
.sheet .sum div{display:flex;justify-content:space-between}
.sheet .sum span{opacity:.72}
.sheet .sum b{font-weight:700}
.sheet .sum .d b{color:#47B147}
.sheet .closing{display:flex;flex-direction:column;gap:24px}
.sheet .tot{background:#2E47E6;color:#fff;border-radius:16px;padding:28px;display:flex;justify-content:space-between;align-items:flex-end}
.sheet .tot .k{opacity:.8}
.sheet .tot small{display:block;margin-top:4px;font-size:13px;line-height:1.5;opacity:.8}
.sheet .tot b{font-weight:700;font-size:56px;line-height:1}
.sheet .ft{font-size:12px;line-height:1.5;opacity:.6}

@media (max-width:820px){.inv-bar{padding:12px 16px}.inv-bar .l span{display:none}.inv-stage{padding:16px 16px 48px}}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  .inv-bar{display:none!important}
  .inv-stage{padding:0!important;display:block}
  .inv-fit{transform:none!important;width:210mm;height:auto!important}
  .sheet{width:210mm;height:296.8mm;box-shadow:none;page-break-after:avoid;break-after:avoid}
  html,body{margin:0;padding:0;height:auto;overflow:hidden}
}
</style>
<main>
 <div class="inv-bar">
  <a class="l" href="account-orders.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l10 5.8v11.4L12 24 2 18.2V6.8z" fill="#fff" stroke="#121214" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 12.6L22 6.8M12 12.6L2 6.8M12 12.6V24" stroke="#121214" stroke-width="1.4"/><path d="M12 1l10 5.8L12 12.6 2 6.8z" fill="#2E47E6"/></svg><span>Back to orders</span></a>
  <div class="r"><a href="account-orders.html" class="p-btn p-b2 p-bs">Orders</a><button type="button" class="p-btn p-b1 p-bs" id="dl">Download PDF</button></div>
 </div>
 <div class="inv-stage"><div class="inv-fit" id="fit"></div></div>
</main>

<script src="assets/catalogue.js"></script>
<script src="assets/site.js"></script>
<script data-page-script>
(function(){
if(!DP.requireAuth())return;
const FMT={video:'MP4 video',ebooks:'PDF and EPUB',software:'WordPress plugin, ZIP',templates:'WordPress theme, ZIP',audiobooks:'MP3 and MP4'};
const fit=document.getElementById('fit');const ref=DP.qs('ref');const o=ref?DP.orders.get(ref):DP.orders.list()[0];
if(!o){document.querySelector('.inv-stage').innerHTML='<div class="inv-msg"><h1>No invoice to show</h1><p>Invoices appear here once you have bought something from the store.</p><a href="store.html" class="p-btn p-b1">Browse the store</a></div>';document.getElementById('dl').hidden=true;DP.pixeliseAll();return}
const e=DP.esc,m=DP.money;
const LOGO='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l10 5.8v11.4L12 24 2 18.2V6.8z" fill="#121214" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 12.6L22 6.8M12 12.6L2 6.8M12 12.6V24" stroke="#fff" stroke-width="1.4"/><path d="M12 1l10 5.8L12 12.6 2 6.8z" fill="#2E47E6"/></svg>';
const lines=o.lines.map((p,i)=>`<div class="ln"><span class="n">${String(i+1).padStart(2,'0')}</span><div class="i"><b>${e(p.name)}</b><span>${DP.CATS[p.cat].label} · ${FMT[p.cat]}</span></div><span class="p">${m(p.price)}</span></div>`).join('');
fit.innerHTML=`<article class="sheet" aria-label="Invoice ${o.ref}">
 <div class="side"><div class="top"><div class="lg">${LOGO}DesignPixis</div><div class="ttl"><b>Invoice</b><span>${o.ref}</span></div></div>
  <div class="bot"><img class="art" src="assets/img/invoice-art.jpg" alt=""><div class="ct"><b>DesignPixis</b><span>hello@designpixis.com</span><span>designpixis.com</span></div></div></div>
 <div class="main"><div class="content">
  <div class="meta"><div class="who"><span class="k">Billed to</span><b>${e(DP.user.name())}</b></div><div class="iss"><span class="k">Issued</span><span>${DP.fmtDate(o.date)}</span></div></div>
  <div class="dv"></div>
  <div class="lns">${lines}</div>
  <div class="sum"><div><span>Subtotal</span><b>${m(o.subtotal)}</b></div>${o.discount>0?`<div class="d"><span>Discount (${o.code})</span><b>−${m(o.discount)}</b></div>`:''}</div>
 </div>
 <div class="closing"><div class="tot"><div><span class="k">Total paid</span><small>USD, paid in full</small></div><b>${m(o.total)}</b></div><p class="ft">Thanks for buying from DesignPixis. Your files are in your library.</p></div></div>
</article>`;
document.title='DesignPixis invoice '+o.ref;
function scale(){const avail=Math.min(794,document.querySelector('.inv-stage').clientWidth-(innerWidth<=820?32:48));const k=avail/794;fit.style.transform=k<1?`scale(${k})`:'';fit.style.height=k<1?(1123*k)+'px':'';fit.style.width=k<1?(794*k)+'px':''}
scale();addEventListener('resize',scale);
const doPrint=()=>{const im=fit.querySelector('img');const go=()=>setTimeout(()=>window.print(),150);(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>im.complete?go():im.addEventListener('load',go,{once:true}))};
document.getElementById('dl').addEventListener('click',doPrint);
if(DP.qs('print')==='1'){history.replaceState(null,'','invoice.html?ref='+encodeURIComponent(o.ref));doPrint()}
})();
</script>
</body>
</html>
